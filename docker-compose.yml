services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env to your external PostgreSQL connection URL}
      API_PORT: 3001
      USER_AGENT: "RouteAble/0.1 (hackyeah-2026)"
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env to your external PostgreSQL connection URL}
      MCP_TRANSPORT: http
      FASTMCP_HOST: 0.0.0.0
      FASTMCP_PORT: 3002
    ports:
      - "3002:3002"
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      ROUTEABLE_API_URL: http://api:3001
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - api
