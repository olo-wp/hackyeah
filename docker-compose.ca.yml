services:
  api:
    build:
      args:
        CACHE_BUSTER: ${ROUTEABLE_CA_CERT}
      secrets:
        - routeable_ca
  mcp:
    build:
      args:
        CACHE_BUSTER: ${ROUTEABLE_CA_CERT}
      secrets:
        - routeable_ca
  web:
    build:
      args:
        CACHE_BUSTER: ${ROUTEABLE_CA_CERT}
      secrets:
        - routeable_ca

secrets:
  routeable_ca:
    file: ${ROUTEABLE_CA_CERT:?Set ROUTEABLE_CA_CERT to a PEM-encoded root CA file}