[project]
name = "routeable-model"
version = "0.1.0"
description = "Shared accessibility domain model (types, enums, schemas)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/routeable_model"]
