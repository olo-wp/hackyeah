[project]
name = "routeable-provider-osm"
version = "0.1.0"
description = "OpenStreetMap provider (Nominatim + Overpass)"
requires-python = ">=3.12"
dependencies = [
    "routeable-model",
    "routeable-provider-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/routeable_provider_osm"]

[tool.uv.sources]
routeable-model = { workspace = true }
routeable-provider-core = { workspace = true }
