[project]
name = "routeable-mcp"
version = "0.1.0"
description = "RouteAble MCP server — the same accessibility service, exposed to AI agents"
requires-python = ">=3.12"
dependencies = [
    "routeable-api",
    "routeable-engine",
    "routeable-model",
    "routeable-provider-core",
    "mcp>=1.2.0",
]

[project.scripts]
routeable-mcp = "routeable_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/routeable_mcp"]

[tool.uv.sources]
routeable-api = { workspace = true }
routeable-engine = { workspace = true }
routeable-model = { workspace = true }
routeable-provider-core = { workspace = true }
