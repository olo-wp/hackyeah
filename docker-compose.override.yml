# Local development only — the committed docker-compose.yml expects an external
# PostgreSQL. Compose loads this file automatically on top of it.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: routeable
      POSTGRES_PASSWORD: routeable
      POSTGRES_DB: routeable
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routeable -d routeable"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    depends_on:
      postgres:
        condition: service_healthy

  mcp:
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
